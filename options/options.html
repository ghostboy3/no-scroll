<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <h1>NoScroll Settings</h1>
      <p>Choose where reels from accounts you don't follow should be hidden.</p>
      <label class="switch">
        <input id="scope-home" type="checkbox" />
        <span>Home feed</span>
      </label>
      <label class="switch">
        <input id="scope-reels" type="checkbox" />
        <span>Reels tab</span>
      </label>
      <label class="switch">
        <input id="scope-explore" type="checkbox" />
        <span>Explore page</span>
      </label>
    </main>

    <script src="options.js"></script>
  </body>
</html>
